# SMOKE variant of arxivmia_npo.yaml -- 6 unlearning steps, 40 scored samples
# per population, Fisher SIF off (its 200-sample holdout does not fit in 40).
#
# Nothing this produces is a measurement. Under the preregistration a smoke test
# may check exactly two things:
#
#   * numerical stability -- finite loss, finite gradients, no NaN, the run
#     completes and writes the artifacts the audit expects;
#   * that the parameters have their intended QUALITATIVE effect -- the forget
#     loss rises, and the NPO weight 2*sigmoid(beta*r) starts at 1.0 and falls.
#
# It may NOT be used to choose the learning-rate grid, to select beta, or to
# alter any threshold. Those are frozen in configs/preregistration_v3_fllm.yaml.

training_mode: lora
device: cuda
seed: 42

model:
  name: "meta-llama/Llama-3.2-1B"
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  torch_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  bias: none
  task_type: CAUSAL_LM

data:
  name: "zhliu/ArxivMIA"
  split: train
  text_field: text
  train_samples: 2000
  test_samples: 1000
  forget_ratio: 0.2
  max_length: 512

training:
  epochs: 1
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_steps: 100
  max_grad_norm: 1.0

unlearning:
  npo:
    steps: 6
    learning_rate: 2.8e-5
    batch_size: 2
    beta: 0.1
    retain_weight: 1.0
    log_ratio_reduction: sum
    max_grad_norm: 1.0
    collapse_loss: 20.0
    probe_every: 2        # dense, so the weight's decay is visible in 6 steps
    probe_samples: 8

routine_update:
  learning_rate: 5.0e-5
  epochs: 1
  batch_size: 4
  gradient_accumulation_steps: 1
  source: test_tail
  n_samples: 16

scoring:
  param_scope: trainable
  eps: 1.0e-12
  max_length: 512
  unlearning_direction: param_diff
  max_samples_per_population: 40

scores:
  loss_unlearned:
    enabled: true
  loss_calibrated:
    enabled: true
    reference: pretrained_base
  loss_vs_finetuned:
    enabled: true
  grad_norm_sq:
    enabled: true
  grad_calibrated:
    enabled: true
    reference: finetuned_pre_unlearning
  fuma:
    enabled: true
    denominator_source: shadow_bf16
    norm: l1_mean_abs
    weighting: parameter
  sif:
    enabled: false
    method: fisher
    damping: 1.0e-3
    fisher_rank: 200
    fisher_device: cpu
    beta: 1.0

evaluation:
  seeds: [42]
  methods: [npo]
  n_bootstrap: 100

paths:
  checkpoints: "./ds_checkpoints"
  results: "./fllm_audit/smoke"
