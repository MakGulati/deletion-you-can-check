# FACTORIAL CELL: ArxivMIA + Qwen2.5-1.5B.
#
# Purpose: de-confound corpus from model family. The study so far pairs
# ArxivMIA with Llama-3.2-1B and BookMIA with Qwen2.5-1.5B, so every
# cross-dataset difference -- including both headline findings -- confounds
# corpus, model family and truncation regime. This cell and its sibling
# (bookmia_llama.yaml) complete the 2x2.
#
# Only the EXACT-RETRAINING control is run in the new cells. Both headline
# findings are measured on it: the membership null (where a perfect deletion
# reads) and the matched-access detector comparison. The method verdicts stay at
# two cells, since "no method passes" is a negative result that four cells would
# not change the logical status of.
#
# SCORING IS NORMALISED ACROSS ALL FOUR CELLS. FUMA and Fisher-SIF are off here
# even though Llama+ArxivMIA could afford them, because Qwen+BookMIA cannot and
# a factorial whose cells are scored differently is not a factorial. The
# consequence is no curvature holdout, so retain is scored whole (800) in every
# cell. The Llama+ArxivMIA cell is re-scored under the same rule.

training_mode: lora
device: cuda
seed: 42

model:
  name: "Qwen/Qwen2.5-1.5B"
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  torch_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  bias: none
  task_type: CAUSAL_LM

data:
  name: "zhliu/ArxivMIA"
  split: train
  text_field: text
  train_samples: 2000
  test_samples: 1000
  forget_ratio: 0.2
  max_length: 512

# Effective batch 32, as in every other cell, reached as 4x8 for the same
# memory reason Qwen forces elsewhere.
training:
  epochs: 6
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  warmup_steps: 100
  max_grad_norm: 1.0

scoring:
  param_scope: trainable
  eps: 1.0e-12
  max_length: 512
  unlearning_direction: param_diff
  max_samples_per_population:
    test: 300

scores:
  loss_unlearned:
    enabled: true
  loss_calibrated:
    enabled: true
    reference: pretrained_base
  loss_vs_finetuned:
    enabled: true
  grad_norm_sq:
    enabled: true
  grad_calibrated:
    enabled: true
    reference: finetuned_pre_unlearning
  fuma:
    enabled: false
    denominator_source: none
    norm: l1_mean_abs
    weighting: parameter
  sif:
    enabled: false
    method: gradient
    damping: 1.0e-3
    fisher_rank: 200
    fisher_device: cpu
    beta: 1.0

evaluation:
  seeds: [42, 43, 44]
  n_bootstrap: 1000

paths:
  checkpoints: "./ds_factorial/arxivmia_qwen/checkpoints"
  results: "./ds_factorial/arxivmia_qwen"
