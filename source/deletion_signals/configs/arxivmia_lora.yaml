# ArxivMIA + Llama-3.2-1B QLoRA -- the setting the existing three seeds used.
#
# This mirrors unlearning_paradox_sanity/config_llama_3_2_1b.yaml so the new
# per-sample tables are comparable with the legacy
# results_seed4*/*/per_sample_components.json files re-analysed by
# `offline_eval --legacy`. ArxivMIA has 1000 members and 1000 non-members, which
# with forget_ratio 0.2 and a fisher_rank 200 curvature holdout reproduces the
# legacy populations exactly: forget 200, retain 600, test 1000.

training_mode: lora
device: cuda
seed: 42

model:
  name: "meta-llama/Llama-3.2-1B"
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  torch_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  bias: none
  task_type: CAUSAL_LM

data:
  name: "zhliu/ArxivMIA"
  split: train
  text_field: text
  train_samples: 2000     # capped to the 1000 members the dataset has
  test_samples: 1000
  forget_ratio: 0.2
  max_length: 512

training:
  epochs: 6
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_steps: 100
  max_grad_norm: 1.0

unlearning:
  ga_gd:
    steps: 100
    ascent_lr: 1.0e-5
    descent_lr: 2.0e-5
    batch_size: 4
  scrub:
    steps: 100
    learning_rate: 1.0e-5
    batch_size: 4
    kl_temperature: 4.0
    forget_kl_weight: 0.1
    forget_entropy_weight: 0.5
    retain_ce_weight: 1.0
    retain_kl_weight: 1.0

scoring:
  param_scope: trainable
  eps: 1.0e-12
  max_length: 512
  unlearning_direction: param_diff

scores:
  loss_unlearned:
    enabled: true
  loss_calibrated:
    enabled: true
    reference: pretrained_base
  grad_norm_sq:
    enabled: true
  grad_calibrated:
    enabled: true
    reference: finetuned_pre_unlearning
  fuma:
    enabled: true
    denominator_source: shadow_bf16
    norm: l1_mean_abs
    weighting: parameter
  sif:
    # On here, unlike the other configs: the legacy files carry a SIF column and
    # the comparison is only like-for-like if this one does too. G is
    # 200 x 3.4M float32 = 2.7 GB, held on the CPU.
    enabled: true
    method: fisher
    damping: 1.0e-3
    fisher_rank: 200
    fisher_device: cpu
    beta: 1.0

evaluation:
  seeds: [42, 43, 44]
  methods: [ga_gd, scrub]
  n_bootstrap: 1000

paths:
  checkpoints: "./ds_checkpoints"
  results: "./ds_results"
